<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バチバチキャッチャー | Static Catch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="game-header">
    <h1 class="logo">バチバチ<span>キャッチャー</span></h1>
    <div class="header-buttons">
      <button id="btn-ranking" class="btn-ghost">🏆 ランキング</button>
      <button id="btn-restart" class="btn-ghost">🔄 リスタート</button>
    </div>
  </header>

  <main id="game-main">

    <!-- サイドパネル：スコア・チャージ・鉄屑 -->
    <aside id="side-panel">
      <div class="panel-box">
        <div class="panel-label">SCORE</div>
        <div id="score-value" class="panel-value">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">CHARGE</div>
        <div class="gauge-outer">
          <div id="charge-fill" class="gauge-fill charge-fill"></div>
        </div>
        <div id="charge-pct" class="gauge-pct">0%</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">鉄屑</div>
        <div class="gauge-outer">
          <div id="litter-fill" class="gauge-fill litter-fill"></div>
        </div>
        <div id="litter-pct" class="gauge-pct">0/8</div>
      </div>
    </aside>

    <!-- ゲームキャンバス -->
    <section id="game-stage">
      <div id="canvas-container"></div>

      <!-- スタート案内 -->
      <div id="start-hint">
        <div class="hint-card">
          <div class="hint-title">⚡ バチバチキャッチャー</div>
          <p>鉄屑を<strong>川</strong>に落とさないように守るゲーム。</p>
          <p>押し続けて<strong>チャージ</strong>（移動が遅くなる）。<br>離すと<strong>静電気の弾き</strong>で鉄屑を吹き飛ばせ！</p>
          <p>電池に触れると即フルチャージ！ドラム缶の直撃はゲームオーバー。</p>
          <p class="hint-small">タップして スタート</p>
        </div>
      </div>

      <!-- ゲームオーバーオーバーレイ -->
      <div id="gameover-overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="over-title">GAME OVER</h2>
          <p class="over-reason" id="over-reason"></p>
          <p class="final-score">最終スコア：<span id="final-score-value">0</span></p>
          <form id="score-form">
            <input id="player-name" type="text" maxlength="12" placeholder="なまえ（12文字まで）" autocomplete="off" required>
            <button type="submit" class="btn-primary">スコアを登録</button>
          </form>
          <button id="btn-play-again" class="btn-ghost">もう一度遊ぶ</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ランキングモーダル -->
  <div id="ranking-modal" class="overlay hidden">
    <div class="overlay-card">
      <h2>🏆 スコアランキング</h2>
      <ol id="ranking-list" class="ranking-list">
        <li class="ranking-loading">読み込み中...</li>
      </ol>
      <button id="btn-close-ranking" class="btn-ghost">閉じる</button>
    </div>
  </div>

</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="script.js"></script>
</body>
</html>
